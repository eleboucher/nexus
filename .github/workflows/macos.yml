name: "Build MacOS App"

on:
  push:
    branches: ["main"]
    tags: ["*"]
  workflow_dispatch:

jobs:
  build-app:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Lix GHA Installer Action
        uses: samueldr/lix-gha-installer-action@v2026-02-22
        with:
          extra_nix_config: experimental-features = nix-command flakes flake-self-attrs

      - name: Build app
        run: |
          nix develop --command bash -c '
            set -e
            flutter pub get
            dart scripts/generate.dart
            flutter pub run build_runner build

            FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
            sudo find -L "$FLUTTER_ROOT" -type d -iname "*.framework" -exec chmod -R u+w {} +

            # Xcode/SPM pick up nix devshell'"'"'s compiler env vars (NIX_LDFLAGS
            # etc.) and mangle them into malformed -Xlinker chains. unset alone
            # does not survive: flutter'"'"'s Nix wrapper re-injects them via
            # --set-default, which only skips vars that are already present
            # (even if empty) - so set them empty instead of unsetting.
            export LDFLAGS= CFLAGS= CXXFLAGS= CPPFLAGS= NIX_LDFLAGS= NIX_CFLAGS_COMPILE= NIX_CFLAGS_LINK=

            flutter build macos --release
          '

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: App
          path: build/macos/Build/Products/Release/Nexus.app
